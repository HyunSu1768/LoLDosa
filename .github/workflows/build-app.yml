name: build-app

# 설치 파일 만들기: Actions 탭에서 'Run workflow' 를 누르거나 v* 태그를 올리면
# Windows(.zip 안 LoLDosa.exe)·macOS 빌드를 만들어 아티팩트로 올린다.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "이 이름으로 Release 를 만들고 zip 을 올려요 (비우면 아티팩트만)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # v* 태그면 Release 에 zip 을 올린다 (로그인 없이 받는 공개 링크)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv sync --extra app --extra dev
          uv pip install pyinstaller
      - name: Test
        run: uv run pytest -q
      - name: Version
        shell: bash
        run: echo "${{ inputs.release_tag || github.ref_name }}" > src/loldosa/VERSION   # 앱이 업데이트를 비교할 때 쓰는 버전
      - name: Build
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          uv run pyinstaller --noconfirm --windowed --name LoLDosa \
            --collect-data loldosa --collect-submodules loldosa --collect-all webview \
            --add-data "../bundle${SEP}bundle" \
            --hidden-import uvicorn.logging --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on \
            ../packaging/loldosa_app.py
      - name: Smoke test (frozen app serves)
        shell: bash
        run: |
          EXE=dist/LoLDosa/LoLDosa; [ "$RUNNER_OS" = "Windows" ] && EXE=dist/LoLDosa/LoLDosa.exe
          [ "$RUNNER_OS" = "macOS" ] && EXE=dist/LoLDosa.app/Contents/MacOS/LoLDosa
          export LOLDOSA_HOME="$RUNNER_TEMP/loldosa_home"
          "$EXE" app --browser --no-ai --port 8799 > smoke.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/api/status && { ok=1; break; }; sleep 2; done
          echo "--- smoke.log"; cat smoke.log || true
          echo "--- loldosa.log"; cat "$LOLDOSA_HOME/data/loldosa.log" 2>/dev/null || true
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v5
        with:
          name: LoLDosa-${{ runner.os }}
          path: |
            backend/dist/LoLDosa
            backend/dist/LoLDosa.app
      - name: "Self-update test (Windows — 옛 버전으로 표시한 복사본이 최신 Release 로 바뀌고 다시 켜지는지)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process LoLDosa -ErrorAction SilentlyContinue | Stop-Process -Force   # 앞 단계 스모크 테스트 프로세스 정리
          Start-Sleep 2
          $t = Join-Path $env:RUNNER_TEMP "uptest"
          Copy-Item -Recurse dist\LoLDosa $t
          Set-Content -Path "$t\_internal\loldosa\VERSION" -Value "v0.0.1" -NoNewline
          $before = (Get-Item "$t\LoLDosa.exe").LastWriteTimeUtc
          $env:LOLDOSA_HOME = Join-Path $env:RUNNER_TEMP "uphome"
          Start-Process -FilePath "$t\LoLDosa.exe" -ArgumentList "app","--browser","--no-ai","--port","8798"
          for ($i=0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:8798/api/status | Out-Null; break } catch { Start-Sleep 2 } }
          $u = Invoke-RestMethod http://127.0.0.1:8798/api/update
          "update check: $($u | ConvertTo-Json -Compress)"
          if (-not $u.available) { throw "업데이트가 있다고 나와야 해요" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8798/api/update/apply | Out-Null
          $ok = $false
          for ($i=0; $i -lt 120; $i++) {
            Start-Sleep 2
            $after = (Get-Item "$t\LoLDosa.exe").LastWriteTimeUtc
            if ($after -ne $before -and (Get-Process LoLDosa -ErrorAction SilentlyContinue)) { $ok = $true; break }
          }
          Get-Process LoLDosa -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "파일이 바뀌고 앱이 다시 켜져야 해요" }
          "self-update OK"
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip ../LoLDosa-Windows.zip LoLDosa > /dev/null; else ditto -c -k --keepParent LoLDosa.app ../LoLDosa-macOS.zip; fi
      - name: Release (v* 태그 또는 수동 실행 때 release_tag 를 주면)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: LoLDosa ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: backend/LoLDosa-*.zip
