[project]
name = "loldosa"
version = "0.1.0"
description = "Jungle champ-select briefing: data pipeline + LCU bridge"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "duckdb>=1.1",
    "pyarrow>=15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
# 데스크톱 창 (Windows: WebView2, macOS: WKWebView). 없으면 브라우저로 연다.
app = ["pywebview>=5.0"]
# 영상 가이드 자막 수집
kb = ["youtube-transcript-api>=1.0"]

[project.scripts]
loldosa = "loldosa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loldosa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
